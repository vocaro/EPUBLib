<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  The same policy the scheme handler serves as a response header, repeated here so the page
  carries its own. Two deliveries, one string: ReaderEPUBRouter.contentSecurityPolicy is the
  source of truth and a test asserts this attribute equals it. A book's section document is a
  blob: URL created by this page and inherits this policy, which is what stops the book's own
  scripts, inline handlers and remote references — there is no remote origin anywhere below.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' blob: data: 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; media-src blob: data:; frame-src blob:; connect-src 'self' blob:; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Reader</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: Canvas;
    color: CanvasText;
    color-scheme: light dark;
    /* The host owns the chrome. Nothing in this page scrolls; the renderer paginates. */
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  foliate-view {
    display: block;
    width: 100%;
    height: 100%;
  }
  /*
    The continuous-scroll edge fade (bootstrap.js: EDGE_FADE_RAMP_PX / updateEdgeFades). Two
    fixed strips outside `foliate-view`, so they sit above whatever section is on screen without
    the paginator's own closed shadow root ever knowing they exist. `Canvas`/`CanvasText` are
    system color keywords, so the gradient tracks the same light/dark appearance
    `ReaderEPUBTypography.css` puts on the book itself, with no separate flag from Swift needed.
    `opacity` is set inline per frame; the height here is only the band the gradient spans.
  */
  .sw-edge-fade {
    position: fixed;
    left: 0;
    right: 0;
    height: 56px;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }
  .sw-edge-fade[data-edge="top"] {
    top: 0;
    background: linear-gradient(to bottom, Canvas 0%, transparent 100%);
  }
  .sw-edge-fade[data-edge="bottom"] {
    bottom: 0;
    background: linear-gradient(to top, Canvas 0%, transparent 100%);
  }
</style>
</head>
<body>
<!--
  No inline script and no inline event handler, on this page or from the book: script-src above
  has no 'unsafe-inline', so the policy and the page agree rather than the page relying on the
  policy having an exception carved for it.
-->
<script type="module" src="bootstrap.js"></script>
</body>
</html>
