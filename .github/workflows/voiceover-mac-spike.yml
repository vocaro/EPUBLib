name: Mac VoiceOver spike

# A spike, not a check: can the Mac speech harness of doc/voiceover-testing.md run on a hosted
# runner instead of a workstation? It runs for pushes to its own branch only.
on:
  push:
    branches: [claude/brave-bell-dc7959]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session:
    name: Session (${{ matrix.variant }})
    # The standard label only: larger runners are billed even in a public repository.
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # XCTest's Automation Running banner is killed and respawned about every ten seconds
        # on this image, and VoiceOver moves to each new one. `banner-off` stops launchd from
        # starting it; `banner-on` leaves the image as it is, for comparison.
        variant: [banner-off, banner-on]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      RESULTS: .build/voiceover/results
      READER: .build/voiceover/mac/Build/Products/Debug/VoiceOverVerificationMac.app
    steps:
      - name: Note the start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Diagnostics
        run: |
          set +e
          mkdir -p "$RESULTS"
          sw_vers
          xcodebuild -version
          csrutil status
          system_profiler SPAudioDataType
          who
          echo "VoiceOver state: $(defaults read com.apple.universalaccess voiceOverOnOffKey 2>&1)"
          echo "VoiceOver process: $(pgrep -lx VoiceOver || echo none)"
          echo "VoiceOver AppleScript setting: $(defaults read com.apple.VoiceOver4/default SCREnableAppleScript 2>&1)"
          automationmodetool
          echo "Screen: $(osascript -e 'tell application "Finder" to get bounds of window of desktop' 2>&1)"
          echo "Secure input: $(ioreg -l -w 0 -d 1 | grep -c kCGSSessionSecureInputPID)"
          echo "Frontmost: $(osascript -e 'tell application "System Events" to return bundle identifier of first application process whose frontmost is true' 2>&1)"
          echo "Processors: $(sysctl -n hw.ncpu), memory: $(($(sysctl -n hw.memsize) / 1073741824)) GB"
          exit 0

      - name: Prepare the runner for VoiceOver
        run: |
          # VoiceOver's welcome dialog on a Mac that has never run it.
          defaults write com.apple.VoiceOverTraining doNotShowSplashScreen -bool true
          # Each VoiceOver command presses Control; the default shortcut offers Dictation for it.
          defaults write com.apple.HIToolbox AppleDictationAutoEnable -int 0
          if [ "${{ matrix.variant }}" = banner-off ]; then
            launchctl disable "gui/$(id -u)/com.apple.dt.AutomationModeUI"
            launchctl print-disabled "gui/$(id -u)" | grep -i automation || echo "Not listed as disabled"
          fi

      - name: Generate the project
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          python3 scripts/make-voiceover-fixture.py
          xcodegen generate --spec Examples/VoiceOverVerification/project.yml
          echo "Elapsed: $(($(date +%s) - JOB_START)) s"

      - name: Build for testing, signed ad hoc without a team
        run: |
          if ! xcodebuild -project Examples/VoiceOverVerification/VoiceOverVerification.xcodeproj \
              -scheme VoiceOverProbeMac -destination 'platform=macOS' \
              -derivedDataPath .build/voiceover/mac \
              CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build-for-testing > "$RESULTS/build.log" 2>&1; then
            grep -E "error:|Signing|requires a development team" "$RESULTS/build.log" | head -n 40
            tail -n 40 "$RESULTS/build.log"
            exit 1
          fi
          tail -n 2 "$RESULTS/build.log"
          codesign -dvv "$READER" 2>&1 | grep -E "Signature|TeamIdentifier"
          echo "Elapsed: $(($(date +%s) - JOB_START)) s"

      - name: Run the speech sessions
        run: |
          set +e
          failures=0
          # session NAME RUNNER-ARGUMENTS...: a fresh reader, one session, its transcript.
          session() {
            name=$1
            shift
            pkill -x VoiceOverVerificationMac && sleep 6
            open -na "$PWD/$READER" --args -SampleFlow paginated -SampleFontSize 23
            sleep 8
            started=$(date +%s)
            python3 scripts/run-voiceover-mac.py --timeout 300 "$@"
            status=$?
            [ "$status" -eq 0 ] || failures=$((failures + 1))
            transcript=$(ls -t "$RESULTS"/mac-*.transcript.txt 2>/dev/null | head -n 1)
            echo "$name: exit $status, $(($(date +%s) - started)) s, ${transcript##*/}" | tee -a "$RESULTS/sessions.txt"
            echo "Elapsed: $(($(date +%s) - JOB_START)) s; VoiceOver state $(defaults read com.apple.universalaccess voiceOverOnOffKey 2>&1)"
            screencapture -x "$RESULTS/screen-$name.png"
            echo "::group::Transcript of $name"
            cat "$transcript"
            echo "::endgroup::"
          }
          # Where Next Page is depends on the window, which this runner's 1024 by 768 screen
          # makes smaller than the documented one: walk left from the last column and count.
          steps=(ax:next ax:lines ax:focus in line nextline out)
          for _ in $(seq 14); do steps+=(left); done
          session explore "${steps[@]}"
          count=$(awk '/ STEP left/ { steps++ } / heard: .*Next Page/ && steps { print steps; exit }' "$transcript")
          echo "Next Page is ${count:-not found} steps left of the last column"
          [ -n "$count" ] || exit 1

          # An entry line, a line move, a VoiceOver-activated Next Page, and the new first line.
          steps=(ax:next ax:lines ax:focus in line nextline out)
          for _ in $(seq "$count"); do steps+=(left); done
          steps+=("activate=Next Page" ax:lines)
          for _ in $(seq $((count - 1))); do steps+=(right); done
          steps+=(in line)
          session fixed-pause "${steps[@]}"
          session advance --advance-after 0.5 "${steps[@]}"
          exit "$failures"

      - name: Collect the end state
        if: always()
        run: |
          set +e
          mkdir -p "$RESULTS"
          screencapture -x "$RESULTS/screen-end.png"
          echo "VoiceOver state: $(defaults read com.apple.universalaccess voiceOverOnOffKey 2>&1)"
          echo "VoiceOver process: $(pgrep -lx VoiceOver || echo none)"
          # The banner's starts and the kernel's kills of it, and anything from Dictation.
          /usr/bin/log show --last 20m --style compact --info --predicate \
            '(process == "AutomationModeUI" AND subsystem == "com.apple.dt.AutomationModeUI") OR ((process == "kernel" OR process == "launchd") AND eventMessage CONTAINS "AutomationModeUI") OR process == "DictationIM"' \
            2>&1 | grep -v -E "tccd|static code" | cut -c 1-300 | tail -n 3000 > "$RESULTS/banner-and-dictation.log"
          echo "Banner starts: $(grep -c 'Successfully spawned AutomationModeUI' "$RESULTS/banner-and-dictation.log"), kills: $(grep -c 'killing_specific_process.*AutomationModeUI' "$RESULTS/banner-and-dictation.log"), Dictation lines: $(grep -c DictationIM "$RESULTS/banner-and-dictation.log")"
          rm -f "$RESULTS/voiceover-ax-observer"
          cat "$RESULTS/sessions.txt"
          du -sh "$RESULTS"/* | sort -h | tail -n 5
          echo "Elapsed: $(($(date +%s) - JOB_START)) s"

      - name: Upload the transcripts, logs and last screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voiceover-${{ matrix.variant }}
          path: |
            .build/voiceover/results/*.txt
            .build/voiceover/results/*.log
            .build/voiceover/results/screen-end.png
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: warn

      - name: Upload the result bundles and every screenshot of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: voiceover-${{ matrix.variant }}-failure
          path: |
            .build/voiceover/results/*.xcresult
            .build/voiceover/results/*.png
          include-hidden-files: true
          retention-days: 5
          if-no-files-found: warn
