name: Mac unit tests

# `swift test` on a hosted runner, which nothing else is using while the tests run.
# See "Hosted Mac tests" in doc/testing.md.
on:
  # A pull request is tested as merged into its base. To test by hand and on main only,
  # delete this trigger.
  pull_request:
    paths-ignore: ['doc/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['doc/**', '**.md']
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag or full commit SHA whose tests are built and run. Empty runs the branch
          the run is started from.
        type: string
      filter:
        description: >-
          Regular expression for `swift test --filter`, such as ReaderCanvasViewTests. Empty
          runs every test.
        type: string
      repeat:
        description: How many times the tests run, one pass after another in one build.
        type: string
        default: '1'
      scroll_bars:
        description: >-
          The scroll bars the tests run under. legacy: as a Mac with a mouse shows. overlay: as
          a Mac with a trackpad shows. both: each of those in a job of its own. automatic: the
          runner's own setting, overlay as a process starts and legacy a moment later.
        type: choice
        options: [legacy, overlay, both, automatic]
        default: legacy

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Mac unit tests, {0}, {1}{2}, {3} scroll bars', inputs.ref || github.ref_name, inputs.filter || 'every test', inputs.repeat != '1' && format(', {0} passes', inputs.repeat) || '', inputs.scroll_bars == 'both' && 'both kinds of' || inputs.scroll_bars) || '' }}

permissions:
  contents: read

# A newer run for the same pull request, or by hand for the same ref, filter, count and scroll
# bars, replaces one still in progress. A run for main finishes; of those waiting behind it only
# the newest is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ inputs.filter }}-${{ inputs.repeat }}-${{ inputs.scroll_bars }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: swift test, ${{ matrix.scroll_bars }} scroll bars
    # The standard label only: a larger runner, such as xcode-27-xlarge, is billed even in a
    # public repository.
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      # Which kinds a test fails under is part of the result, so one job does not stop the other.
      fail-fast: false
      matrix:
        # By hand, the kinds asked for. A push to main gets both. A pull request gets legacy
        # ones only: each job takes a runner from the few that every run in the repository
        # waits for. To give a pull request both, put 'both' in place of the expression in the
        # inner brackets.
        scroll_bars: ${{ fromJSON((inputs.scroll_bars || (github.event_name == 'push' && 'both' || 'legacy')) == 'both' && '["overlay", "legacy"]' || format('["{0}"]', inputs.scroll_bars || 'legacy')) }}
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SCROLL_BARS: ${{ matrix.scroll_bars }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set the scroll bars
        if: matrix.scroll_bars != 'automatic'
        run: |
          # "Show scroll bars" is a setting of the logged-in user: for GitHub's disposable
          # machine only. A workstation runs a bundle under either kind by an argument, with no
          # setting changed ("Local gate" in doc/testing.md).
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            echo "::error::This step changes the scroll bar setting of a disposable hosted runner and must not run on $RUNNER_ENVIRONMENT"
            exit 1
          fi
          case "$SCROLL_BARS" in
            overlay) defaults write -g AppleShowScrollBars WhenScrolling ;;
            legacy) defaults write -g AppleShowScrollBars Always ;;
            *) echo "::error::No setting gives '$SCROLL_BARS' scroll bars"; exit 1 ;;
          esac

      - name: Describe the runner
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "Commit: $(git log -1 --format='%H %s')"
          echo "Image: xcode-27 $RUNNER_ARCH (${ImageOS:-unknown}) ${ImageVersion:-unknown}"
          echo "System: $(sw_vers -productName) $(sw_vers -productVersion) $(sw_vers -buildVersion)"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          echo "Processors: $(sysctl -n hw.ncpu), memory: $(($(sysctl -n hw.memsize) / 1073741824)) GB"
          # Some canvas tests lay text out beside a scroll bar. On the automatic setting a
          # process starts with overlay ones and learns of a pointing device, which makes them
          # legacy, a moment after it first asks: so the kind is read twice.
          cat > "$RUNNER_TEMP/scroll-bars.swift" <<'SWIFT'
          import AppKit
          let first = NSScroller.preferredScrollerStyle
          RunLoop.main.run(until: Date(timeIntervalSinceNow: 2))
          let later = NSScroller.preferredScrollerStyle
          print(first == .legacy ? "legacy" : "overlay", later == .legacy ? "legacy" : "overlay")
          SWIFT
          read -r first later <<< "$(swift "$RUNNER_TEMP/scroll-bars.swift" || echo unknown unknown)"
          echo "Scroll bars: $first as a process starts, $later two seconds later"
          if [ "$SCROLL_BARS" != automatic ] && [ "$first $later" != "$SCROLL_BARS $SCROLL_BARS" ]; then
            echo "::error::A process on the runner has $first scroll bars and then $later ones, and this job is for $SCROLL_BARS ones"
            exit 1
          fi

      - name: Build
        run: |
          swift build --build-tests
          echo "Built $(($(date +%s) - JOB_START)) s after the job started"

      - name: Test
        env:
          FILTER: ${{ inputs.filter }}
          REPEAT: ${{ inputs.repeat || '1' }}
          # Foundation's switch for a standard output with no buffer. With it `swift test`
          # writes each line as a test makes it. Without, it holds the newest 16 KB of a pass,
          # which is where a pass that hangs is.
          NSUnbufferedIO: 'YES'
        run: |
          case "$REPEAT" in
            '' | *[!0-9]* | 0*)
              echo "::error::repeat is a whole number from 1 up, not '$REPEAT'"
              exit 1
              ;;
          esac
          arguments=(--skip-build)
          if [ -n "$FILTER" ]; then arguments+=(--filter "$FILTER"); fi
          logs="$RUNNER_TEMP/unit-tests"
          mkdir -p "$logs"
          : > "$logs/failed.txt"
          {
            echo "| Pass | Tests | Failed | Skipped | Seconds | swift test |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Every process started under one, at any depth.
          under() {
            ps -axo pid= -o ppid= | awk -v top="$1" '
              { parent[$1 + 0] = $2 + 0 }
              END {
                for (pid in parent) {
                  up = pid + 0
                  while (up > 1 && up != top && (up in parent)) up = parent[up]
                  if (up == top && pid + 0 != top) print pid
                }
              }' | sort -n
          }

          # The tests a log says began and does not say ended, in the order they began.
          unfinished() {
            sed -n -E \
              -e "s/^Test Case '-\[[^.]+\.([^ ]+) ([^]]+)\]' started\.$/+ \1.\2/p" \
              -e "s/^Test Case '-\[[^.]+\.([^ ]+) ([^]]+)\]' (passed|failed|skipped) \(.*$/- \1.\2/p" \
              -e '/ Test run (started\.|with )/d' \
              -e 's/^[^ ]+ +Test (.+) started\.$/+ \1/p' \
              -e 's/^[^ ]+ +Test (.+) (passed|failed) after [0-9.]+ seconds.*$/- \1/p' \
              "$1" | awk '
                { name = substr($0, 3) }
                substr($0, 1, 1) == "+" { began[name] = NR }
                substr($0, 1, 1) == "-" { delete began[name] }
                END { for (name in began) print began[name] "\t" name }' | sort -n | cut -f 2-
          }

          # The last pass ends three minutes before the job's limit.
          deadline=$((JOB_START + 37 * 60))
          result=0
          line="No pass ran"
          ran=0
          red=0
          hung=0
          longest=0
          longest_passed=0
          for pass in $(seq 1 "$REPEAT"); do
            began=$(date +%s)
            if [ $((began + longest)) -gt "$deadline" ]; then
              echo "::error::Passes $pass to $REPEAT were not run: the job's time would have run out"
              result=1
              break
            fi
            # A pass still running at its limit is taken to have hung, and is stopped. The
            # limit is three times the longest pass that passed, and five minutes at least.
            # Until a pass has passed it is twenty minutes, twice a pass of every test.
            limit=$((20 * 60))
            if [ "$longest_passed" -gt 0 ]; then
              limit=$((3 * longest_passed))
              if [ "$limit" -lt 300 ]; then limit=300; fi
            fi
            stop_at=$((began + limit))
            reached="its limit of $limit s"
            if [ "$stop_at" -gt "$deadline" ]; then
              stop_at=$deadline
              reached="the end of the job's time"
            fi
            log="$logs/pass-$pass.log"
            names="$logs/unfinished-$pass.txt"
            status=0
            stopped=""
            sampled=""
            echo "::group::Pass $pass of $REPEAT"
            # `swift test` writes to a file, which `tail` copies to the job's log as it grows,
            # and this loop watches the clock.
            : > "$log"
            swift test "${arguments[@]}" > "$log" 2>&1 &
            runner=$!
            tail -n +1 -f "$log" &
            viewer=$!
            while kill -0 "$runner" 2> /dev/null; do
              if [ "$(date +%s)" -lt "$stop_at" ]; then
                sleep 1
                continue
              fi
              stopped=$(($(date +%s) - began))
              unfinished "$log" > "$names"
              ps -o pid,ppid,etime,pcpu,command -p "$(echo $runner $(under "$runner") | tr ' ' ',')" 2>&1 \
                | cut -c 1-240 > "$logs/processes-$pass.txt" || true
              # What `swift test` has started is running tests: an `xctest` for a bundle of
              # XCTest's, a helper for Swift Testing's. A stack sample, two seconds long, says
              # where each is. With nothing started, `swift test` is sampled itself.
              sampled=$(pgrep -P "$runner" || true)
              sampled=${sampled:-$runner}
              for pid in $sampled; do
                sample "$pid" 2 -file "$logs/sample-$pass-$pid.txt" > "$logs/sample-$pass-$pid.log" 2>&1 || true
              done
              # `swift test` is held still, so that it starts nothing more, and ended with
              # everything under it.
              kill -STOP "$runner" 2> /dev/null || true
              kill -KILL $(under "$runner") "$runner" 2> /dev/null || true
              break
            done
            wait "$runner" 2> /dev/null || status=$?
            took=$(($(date +%s) - began))
            sleep 1
            kill "$viewer" 2> /dev/null || true
            wait "$viewer" 2> /dev/null || true
            echo "::endgroup::"
            # A pass that ended by itself while it was sampled was not stopped.
            if [ "$status" -ne 137 ]; then stopped=""; fi
            if [ -z "$stopped" ]; then
              if [ "$took" -gt "$longest" ]; then longest=$took; fi
              if [ "$status" -eq 0 ] && [ "$took" -gt "$longest_passed" ]; then longest_passed=$took; fi
            fi
            ran=$pass

            # XCTest names each case as it ends. Swift Testing gives one count for its run.
            cases=$(grep -c -E "^Test Case '.*' (passed|failed|skipped) \(" "$log" || true)
            skipped=$(grep -c -E "^Test Case '.*' skipped \(" "$log" || true)
            other=$(sed -n -E 's/^.*Test run with ([0-9]+) tests? .*$/\1/p' "$log" | awk '{ n += $1 } END { print n + 0 }')
            {
              sed -n -E "s/^Test Case '-\[[^.]+\.([^ ]+) ([^]]+)\]' failed \(.*$/\1.\2/p" "$log"
              sed -n -E -e '/Test run with /d' -e 's/^[^ ]+ +Test (.+) failed after [0-9.]+ seconds.*$/\1/p' "$log"
            } | sort -u > "$logs/failed-$pass.txt"
            cat "$logs/failed-$pass.txt" >> "$logs/failed.txt"
            failed=$(wc -l < "$logs/failed-$pass.txt" | tr -d ' ')

            total=$((cases + other))
            outcome="exit $status"
            if [ -n "$stopped" ]; then outcome="stopped at $reached"; fi
            line="Pass $pass of $REPEAT: $total tests, $failed failed, $skipped skipped, $took s, swift test $outcome"
            echo "$line"
            echo "| $pass | $total | $failed | $skipped | $took | $outcome |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$total" -eq 0 ] && [ "$status" -eq 0 ]; then
              # A filter that matches nothing leaves swift test nothing to fail.
              echo "::error::No test ran${FILTER:+: nothing matches the filter '$FILTER'}"
              result=1
              red=$((red + 1))
            elif [ "$status" -ne 0 ]; then
              result=1
              red=$((red + 1))
              # Each failed assertion, where `gh run view` and the pull request show it.
              sed -n -E "s|^$GITHUB_WORKSPACE/([^:]+):([0-9]+): error: -\[[^.]+\.([^ ]+) ([^]]+)\] : (.*)$|::error file=\1,line=\2::\3.\4: \5|p" "$log" \
                | awk 'NR <= 10'
              if [ -n "$stopped" ]; then
                echo "::group::Pass $pass of $REPEAT, where it was stopped"
                cat "$logs/processes-$pass.txt"
                for pid in $sampled; do
                  if [ -s "$logs/sample-$pass-$pid.txt" ]; then
                    # The call graph, without the tallies and the list of libraries after it.
                    awk '/^Total number in stack/ { exit } { print }' "$logs/sample-$pass-$pid.txt"
                  else
                    echo "No sample of process $pid:"
                    cat "$logs/sample-$pass-$pid.log" || true
                  fi
                done
                # The log names a test that began and did not end. A sample may have a frame
                # of a test's own, which names it when the log does not.
                for pid in $sampled; do
                  cat "$logs/sample-$pass-$pid.txt" 2> /dev/null || true
                done | { grep -o -E '[A-Za-z_][A-Za-z0-9_]*\.test[A-Za-z0-9_]*\(' || true; } | tr -d '(' | sort -u > "$logs/frames-$pass.txt"
                echo "Begun and not ended, by the log: $(paste -s -d ' ' "$names")"
                echo "Tests in the frames of a sample: $(paste -s -d ' ' "$logs/frames-$pass.txt")"
                echo "::endgroup::"
                if [ ! -s "$names" ]; then cp "$logs/frames-$pass.txt" "$names"; fi
                where=$(paste -s -d , "$names" | sed 's/,/, /g')
                if [ "$reached" = "the end of the job's time" ]; then
                  echo "::error::Pass $pass of $REPEAT was stopped after $stopped s, at $reached${where:+, in $where}"
                else
                  hung=$((hung + 1))
                  sed 's/$/ (hung)/' "$names" >> "$logs/failed.txt"
                  echo "::error::Pass $pass of $REPEAT hung ${where:+in }${where:-with no test under way}: it was stopped after $stopped s, at $reached"
                fi
              elif [ "$failed" -eq 0 ]; then
                echo "::error::swift test exited $status in pass $pass and named no failed test"
                tail -n 40 "$log"
              fi
            fi
          done

          if [ "$REPEAT" -eq 1 ]; then
            echo "::notice::$line"
          else
            tally="$ran of $REPEAT passes ran and $red of them failed"
            if [ "$hung" -gt 0 ]; then tally="$tally, $hung of those by hanging"; fi
            echo "::notice::$tally"
          fi
          if [ -s "$logs/failed.txt" ]; then
            {
              echo
              echo "Failed, with the number of passes each failed in:"
              echo
              echo '```'
              sort "$logs/failed.txt" | uniq -c | sort -rn
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      # Two checks of the local gate that need no simulator. They run whatever the tests did, so
      # that neither result hides the other.
      - name: Check module boundaries
        if: ${{ !cancelled() }}
        run: python3 scripts/check-modules.py

      - name: Check documentation snippets
        if: ${{ !cancelled() }}
        run: |
          # The snippets come from the sample's shared sources. The build above compiled them
          # with every other target; building that one by name says so and has nothing to do.
          swift build --target ReaderSampleSupport
          python3 scripts/check-docs.py
