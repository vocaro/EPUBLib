name: Mac unit tests

# `swift test` on a hosted runner, which nothing else is using while the tests run.
# See "Hosted Mac tests" in doc/testing.md.
on:
  # A pull request is tested as merged into its base. To test by hand and on main only,
  # delete this trigger.
  pull_request:
    paths-ignore: ['doc/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['doc/**', '**.md']
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag or full commit SHA whose tests are built and run. Empty runs the branch
          the run is started from.
        type: string
      filter:
        description: >-
          Regular expression for `swift test --filter`, such as ReaderCanvasViewTests. Empty
          runs every test.
        type: string
      repeat:
        description: How many times the tests run, one pass after another in one build.
        type: string
        default: '1'
      scroll_bars:
        description: >-
          The scroll bars the tests run under: overlay, as a Mac with a trackpad shows; legacy,
          as it shows while a mouse is attached; or both, each in a job of its own.
        type: choice
        options: [both, overlay, legacy]
        default: both
      probe:
        description: Temporary. Try the argument route on the viewer's bundle.
        type: boolean
        default: false

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Mac unit tests, {0}, {1}{2}{3}', inputs.ref || github.ref_name, inputs.filter || (inputs.scroll_bars == 'legacy' && 'EPUBViewingTests' || 'every test'), inputs.repeat != '1' && format(', {0} passes', inputs.repeat) || '', inputs.scroll_bars != 'both' && format(', {0} scroll bars', inputs.scroll_bars) || '') || '' }}

permissions:
  contents: read

# A newer run for the same pull request, or by hand for the same ref, filter, count and scroll
# bars, replaces one still in progress. A run for main finishes; of those waiting behind it only
# the newest is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}-${{ inputs.filter }}-${{ inputs.repeat }}-${{ inputs.scroll_bars }}-${{ inputs.probe }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: swift test, ${{ matrix.scroll_bars }} scroll bars
    # The standard label only: a larger runner, such as xcode-27-xlarge, is billed even in a
    # public repository.
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      # Which kinds a test fails under is part of the result, so one job does not stop the other.
      fail-fast: false
      matrix:
        # A pull request and a push to main get both kinds. To leave legacy ones to runs by
        # hand, change the first 'both' to 'overlay'.
        scroll_bars: ${{ fromJSON((inputs.scroll_bars || 'both') == 'both' && '["overlay", "legacy"]' || format('["{0}"]', inputs.scroll_bars)) }}
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SCROLL_BARS: ${{ matrix.scroll_bars }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Show legacy scroll bars
        if: matrix.scroll_bars == 'legacy'
        run: |
          # The runner has no mouse, so it is told to show scroll bars always. That is a setting
          # of the logged-in user: for GitHub's disposable machine only. A workstation runs a
          # bundle under legacy scroll bars by an argument instead ("Local gate" in
          # doc/testing.md).
          if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
            echo "::error::This step changes the scroll bar setting of a disposable hosted runner and must not run on $RUNNER_ENVIRONMENT"
            exit 1
          fi
          echo "Before: $(defaults read -g AppleShowScrollBars 2>&1 | tail -n 1)"
          defaults write -g AppleShowScrollBars Always
          echo "After: $(defaults read -g AppleShowScrollBars 2>&1 | tail -n 1)"

      - name: Describe the runner
        run: |
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          echo "Commit: $(git log -1 --format='%H %s')"
          echo "Image: xcode-27 $RUNNER_ARCH (${ImageOS:-unknown}) ${ImageVersion:-unknown}"
          echo "System: $(sw_vers -productName) $(sw_vers -productVersion) $(sw_vers -buildVersion)"
          echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
          echo "Processors: $(sysctl -n hw.ncpu), memory: $(($(sysctl -n hw.memsize) / 1073741824)) GB"
          # Some canvas tests lay text out beside a scroll bar, and the kind a Mac shows
          # follows its pointing device. A process learns the kind a moment after it starts.
          cat > "$RUNNER_TEMP/scroll-bars.swift" <<'SWIFT'
          import AppKit
          RunLoop.main.run(until: Date(timeIntervalSinceNow: 1))
          print(NSScroller.preferredScrollerStyle == .legacy ? "legacy" : "overlay")
          SWIFT
          bars=$(swift "$RUNNER_TEMP/scroll-bars.swift" || echo unknown)
          echo "Scroll bars: $bars"
          if [ "$bars" != "$SCROLL_BARS" ]; then
            echo "::error::The runner shows $bars scroll bars, and this job is for $SCROLL_BARS ones"
            exit 1
          fi

      - name: Build
        run: |
          swift build --build-tests
          echo "Built $(($(date +%s) - JOB_START)) s after the job started"

      - name: Probe the argument route (temporary)
        if: inputs.probe
        run: |
          cat > "$RUNNER_TEMP/probe.swift" <<'SWIFT'
          import AppKit
          let first = NSScroller.preferredScrollerStyle
          RunLoop.main.run(until: Date(timeIntervalSinceNow: 1))
          let later = NSScroller.preferredScrollerStyle
          print("\(first == .legacy ? "legacy" : "overlay") at the start, \(later == .legacy ? "legacy" : "overlay") a second later")
          SWIFT
          echo "As the runner is: $(swift "$RUNNER_TEMP/probe.swift")"
          echo "With the argument: $(swift "$RUNNER_TEMP/probe.swift" -AppleShowScrollBars Always)"
          ls .build/debug | grep xctest
          began=$(date +%s)
          status=0
          xcrun xctest -XCTest All -AppleShowScrollBars Always .build/debug/EPUBViewingTests.xctest > "$RUNNER_TEMP/argument.log" 2>&1 || status=$?
          echo "xctest exit $status after $(($(date +%s) - began)) s"
          grep -E "Scroll bars this Mac prefers" "$RUNNER_TEMP/argument.log" | sort | uniq -c || true
          grep -E "^Test Case '.*' failed|: error: " "$RUNNER_TEMP/argument.log" | head -60 || true
          grep -E "Executed [0-9]+ tests" "$RUNNER_TEMP/argument.log" | tail -n 2 || true

      - name: Test
        env:
          # No other bundle draws a scroll bar, so with no filter the legacy job runs the
          # viewer's tests only.
          FILTER: ${{ inputs.filter || (matrix.scroll_bars == 'legacy' && '^EPUBViewingTests\.' || '') }}
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          case "$REPEAT" in
            '' | *[!0-9]* | 0*)
              echo "::error::repeat is a whole number from 1 up, not '$REPEAT'"
              exit 1
              ;;
          esac
          arguments=(--skip-build)
          if [ -n "$FILTER" ]; then arguments+=(--filter "$FILTER"); fi
          logs="$RUNNER_TEMP/unit-tests"
          mkdir -p "$logs"
          : > "$logs/failed.txt"
          {
            echo "| Pass | Tests | Failed | Skipped | Seconds | swift test |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          # The last pass ends three minutes before the job's limit.
          deadline=$((JOB_START + 37 * 60))
          result=0
          line="No pass ran"
          ran=0
          red=0
          longest=0
          for pass in $(seq 1 "$REPEAT"); do
            began=$(date +%s)
            if [ $((began + longest)) -gt "$deadline" ]; then
              echo "::error::Passes $pass to $REPEAT were not run: the job's time would have run out"
              result=1
              break
            fi
            log="$logs/pass-$pass.log"
            status=0
            echo "::group::Pass $pass of $REPEAT"
            swift test "${arguments[@]}" 2>&1 | tee "$log" || status=$?
            echo "::endgroup::"
            took=$(($(date +%s) - began))
            if [ "$took" -gt "$longest" ]; then longest=$took; fi
            ran=$pass

            # XCTest names each case as it ends. Swift Testing gives one count for its run.
            cases=$(grep -c -E "^Test Case '.*' (passed|failed|skipped) \(" "$log" || true)
            skipped=$(grep -c -E "^Test Case '.*' skipped \(" "$log" || true)
            other=$(sed -n -E 's/^.*Test run with ([0-9]+) tests? .*$/\1/p' "$log" | awk '{ n += $1 } END { print n + 0 }')
            {
              sed -n -E "s/^Test Case '-\[[^.]+\.([^ ]+) ([^]]+)\]' failed \(.*$/\1.\2/p" "$log"
              sed -n -E -e '/Test run with /d' -e 's/^[^ ]+ +Test (.+) failed after [0-9.]+ seconds.*$/\1/p' "$log"
            } | sort -u > "$logs/failed-$pass.txt"
            cat "$logs/failed-$pass.txt" >> "$logs/failed.txt"
            failed=$(wc -l < "$logs/failed-$pass.txt" | tr -d ' ')

            total=$((cases + other))
            line="Pass $pass of $REPEAT: $total tests, $failed failed, $skipped skipped, $took s, swift test exit $status"
            echo "$line"
            echo "| $pass | $total | $failed | $skipped | $took | exit $status |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$total" -eq 0 ] && [ "$status" -eq 0 ]; then
              # A filter that matches nothing leaves swift test nothing to fail.
              echo "::error::No test ran${FILTER:+: nothing matches the filter '$FILTER'}"
              result=1
              red=$((red + 1))
            elif [ "$status" -ne 0 ]; then
              result=1
              red=$((red + 1))
              # Each failed assertion, where `gh run view` and the pull request show it.
              sed -n -E "s|^$GITHUB_WORKSPACE/([^:]+):([0-9]+): error: -\[[^.]+\.([^ ]+) ([^]]+)\] : (.*)$|::error file=\1,line=\2::\3.\4: \5|p" "$log" \
                | awk 'NR <= 10'
              if [ "$failed" -eq 0 ]; then
                echo "::error::swift test exited $status in pass $pass and named no failed test"
                tail -n 40 "$log"
              fi
            fi
          done

          if [ "$REPEAT" -eq 1 ]; then
            echo "::notice::$line"
          else
            echo "::notice::$ran of $REPEAT passes ran and $red of them failed"
          fi
          if [ -s "$logs/failed.txt" ]; then
            {
              echo
              echo "Failed, with the number of passes each failed in:"
              echo
              echo '```'
              sort "$logs/failed.txt" | uniq -c | sort -rn
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      # Two checks of the local gate that need no simulator. They run whatever the tests did, so
      # that neither result hides the other.
      - name: Check module boundaries
        if: ${{ !cancelled() }}
        run: python3 scripts/check-modules.py

      - name: Check documentation snippets
        if: ${{ !cancelled() }}
        run: |
          # The snippets come from the sample's shared sources. The build above compiled them
          # with every other target; building that one by name says so and has nothing to do.
          swift build --target ReaderSampleSupport
          python3 scripts/check-docs.py
